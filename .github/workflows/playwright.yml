name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do seu repositório para a máquina virtual
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instala e configura o ambiente Java (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Substitua por '11' ou '21' caso use outra versão do Java
          cache: 'maven'     # Ativa o cache para acelerar os próximos deploys

      # 3. Compila o projeto e baixa as dependências do Maven sem rodar os testes ainda
      - name: Build & Install Dependencies
        run: mvn -B install -D skipTests --no-transfer-progress

      # 4. Instala os navegadores nativos do Playwright (Chromium, Firefox, WebKit) dentro do Linux do GitHub
      - name: Ensure Playwright browsers are installed
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps"

      # 5. Executa os testes automatizados injetando as credenciais seguras
      - name: Run Playwright Tests
        env:
         NOME_DA_VARIAVEL_NO_SEU_JAVA_LOGIN: ${{ secrets.USER_EMAIL }}
         NOME_DA_VARIAVEL_NO_SEU_JAVA_SENHA: ${{ secrets.USER_PASSWORD }}
        run: mvn test

      # 6. Executa os testes automatizados (Modo Headless nativo)
      - name: Run Playwright Tests
        run: mvn test

      # 7. Salva o relatório de testes (Surefire/Failsafe) como artefato da pipeline (Roda mesmo se os testes falharem)
      - name: Upload Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always() # Garante que o relatório suba mesmo se o teste quebrar
        with:
          name: maven-test-reports
          path: |
            **/target/surefire-reports/
            **/target/playwright-reports/
          retention-days: 30
